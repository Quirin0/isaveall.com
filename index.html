                            <script>
                             $(document).ready(function() {
                              var tamanhoCPF = 11; // Tamanho de um CPF válido

                              // Máscara de CPF
                              $('#cpf').on('input', function() {
                                var cpf = $(this).val().replace(/\D/g, '');

                                if (cpf.length > tamanhoCPF) {
                                  cpf = cpf.slice(0, tamanhoCPF);
                                }

                                cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
                                cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
                                cpf = cpf.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                                $(this).val(cpf);
                              });
                            });

                            function validarCPF(cpf) {
                              cpf = cpf.replace(/[^\d]+/g, ''); // Remove caracteres não numéricos

                              if (cpf.length !== 11 || /^(.)\1+$/.test(cpf)) {
                                return false;
                              }

                              var soma = 0;
                              var resto;

                              for (var i = 1; i <= 9; i++) {
                                soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
                              }

                              resto = (soma * 10) % 11;

                              if (resto === 10 || resto === 11) {
                                resto = 0;
                              }

                              if (resto !== parseInt(cpf.substring(9, 10))) {
                                return false;
                              }

                              soma = 0;

                              for (var j = 1; j <= 10; j++) {
                                soma += parseInt(cpf.substring(j - 1, j)) * (12 - j);
                              }

                              resto = (soma * 10) % 11;

                              if (resto === 10 || resto === 11) {
                                resto = 0;
                              }

                              if (resto !== parseInt(cpf.substring(10, 11))) {
                                return false;
                              }

                              return true;
                            }

                            $(document).ready(function() {
                            $('#form').submit(function(event) {
                              var cpfInput = $('#cpf');
                              var cpf = cpfInput.val();

                              if (!validarCPF(cpf)) {
                                event.preventDefault(); // Impede o envio do formulário

                                exibirErro('Por favor, digite um CPF válido.');
                                cpfInput.addClass('error');
                              } else {
                                iniciarLoading();
                              }
                            });

                            $('#cpf').on('blur', function() {
                              var cpf = $(this).val();

                              if (cpf !== '' && !validarCPF(cpf)) {
                                exibirErro('Por favor, digite um CPF válido.');
                                $(this).addClass('error');
                              }
                            });

                            $('#cpf').on('input', function() {
                              removerErro();
                              $(this).removeClass('error');
                            });
                          });
                          
                            $(document).ready(function() {
                            $('#cpf').on('input', function() {
                              var cpf = $(this).val().replace(/\D/g, '');

                              if (cpf.length === 11) {
                                $('#submit-btn').css('background-color', '#61ce70');
                                $('#submit-btn').css('color', '#fff');
                              } else {
                                $('#submit-btn').css('background-color', '#c3cac4');
                                $('#submit-btn').css('color', '#656161A8');

                              }
                            });
                          });
                          function exibirErro(mensagem) {
                            $('#error').empty().text(mensagem);
                          }

                          function removerErro() {
                            $('#error').empty();
                          }

                          function iniciarLoading() {
                            $('#submit-btn').addClass('loading');
                            $('#submit-btn').prop('disabled', true);

                            setTimeout(function() {
                              $('#form').off('submit');
                              $('#form').submit();
                            }, 5000);
                          }
                            </script>
